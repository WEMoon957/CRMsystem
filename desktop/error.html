<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>SaaS CRM - 启动失败</title>
  <style>
    body {
      margin: 0; padding: 28px 32px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f0f2f5; color: #303133;
    }
    h1 { font-size: 19px; color: #f56c6c; margin-bottom: 8px; }
    #message { font-size: 14px; margin-bottom: 14px; line-height: 1.6; }
    pre {
      background: #1f2d3d; color: #c0c4cc; font-size: 12px; line-height: 1.5;
      padding: 12px; border-radius: 6px; height: 300px; overflow: auto;
      white-space: pre-wrap; word-break: break-all;
    }
    .actions { margin-top: 16px; display: flex; gap: 12px; }
    button {
      flex: 1; height: 38px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px;
    }
    #reconfigure { background: #409eff; color: #fff; }
    #reconfigure:hover { background: #66b1ff; }
    #openLogs { background: #fff; border: 1px solid #dcdfe6; color: #606266; }
    #openLogs:hover { color: #409eff; border-color: #c6e2ff; }
  </style>
</head>
<body>
  <h1>启动失败</h1>
  <div id="message"></div>
  <pre id="log">（无日志）</pre>
  <div class="actions">
    <button id="reconfigure">重新配置</button>
    <button id="openLogs">打开日志目录</button>
  </div>
  <script>
    window.desktop.errorDetail().then((detail) => {
      document.getElementById('message').textContent = detail.message || '未知错误'
      if (detail.logTail) document.getElementById('log').textContent = detail.logTail
    })
    document.getElementById('reconfigure').addEventListener('click', () => window.desktop.reconfigure())
    document.getElementById('openLogs').addEventListener('click', () => window.desktop.openLogs())
  </script>
</body>
</html>
