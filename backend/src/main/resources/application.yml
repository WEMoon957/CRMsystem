server:
  port: 8080

spring:
  application:
    name: saas-crm
  datasource:
    # 本地便携 MySQL 端口 33061；生产环境通过环境变量覆盖
    url: ${MYSQL_URL:jdbc:mysql://localhost:33061/crm_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:crm_dev_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    name: C:/Users/Administrator/WorkBuddy/2026-09-22-11-56-06/backend/logs/app.log
  level:
    root: INFO
    com.saas.crm: INFO

app:
  upload:
    dir: C:/Users/Administrator/WorkBuddy/2026-09-22-11-56-06/backend/uploads
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖（至少 32 字节随机串）
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:120}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}
  seed:
    # 初始种子账号（仅首次启动、表为空时创建）
    admin-username: admin
    admin-password: Admin@123
