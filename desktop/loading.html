<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>SaaS CRM</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #1f2d3d 0%, #2b4b6f 100%);
      color: #fff; user-select: none;
    }
    .spinner {
      width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.25);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 16px; letter-spacing: 1px; }
    .sub { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">SaaS CRM 正在启动</div>
  <div class="sub">首次启动需初始化数据库，可能需要数十秒…</div>
</body>
</html>
